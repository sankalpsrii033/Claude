<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Aether — AI Coding Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #09090b;
  --bg-elevated: #0f0f12;
  --bg-soft: #141418;
  --bg-hover: #1a1a20;
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);
  --purple: #a78bfa;
  --purple-bright: #c4b5fd;
  --purple-glow: rgba(167, 139, 250, 0.15);
  --text: #f4f4f5;
  --text-secondary: #a1a1aa;
  --text-muted: #71717a;
  --error: #f87171;
  --radius: 16px;
  --radius-sm: 10px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

.app { display: flex; height: 100vh; height: 100dvh; position: relative; }

.sidebar {
  width: 280px; background: var(--bg-elevated); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; flex-shrink: 0;
  transition: transform 0.28s cubic-bezier(0.4,0,0.2,1); z-index: 100;
}
.sidebar-header { padding: 16px; border-bottom: 1px solid var(--border); }
.btn-new-chat {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 11px 16px;
  background: linear-gradient(135deg, rgba(167,139,250,0.15), rgba(240,171,252,0.08));
  border: 1px solid rgba(167,139,250,0.25); border-radius: var(--radius-sm);
  color: var(--text); font: 500 14px var(--font); cursor: pointer;
}
.btn-new-chat:active { opacity: 0.85; }
.chat-list { flex: 1; overflow-y: auto; padding: 12px 10px; }
.chat-list-label {
  font-size: 11px; font-weight: 600; text-transform: uppercase;
  letter-spacing: 0.06em; color: var(--text-muted); padding: 8px 10px 6px;
}
.chat-item {
  display: flex; align-items: center; gap: 10px; padding: 10px 12px;
  border-radius: var(--radius-sm); cursor: pointer; color: var(--text-secondary); font-size: 13.5px;
}
.chat-item:active, .chat-item.active { background: rgba(167,139,250,0.12); color: var(--text); }
.chat-item-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-item-actions { display: none; gap: 4px; }
.chat-item:hover .chat-item-actions { display: flex; }
.chat-item-btn {
  width: 26px; height: 26px; border: none; background: transparent;
  color: var(--text-muted); border-radius: 6px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 13px;
}
.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
.topbar {
  height: 56px; display: flex; align-items: center; padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: rgba(15,15,18,0.8); backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px); gap: 12px; flex-shrink: 0; z-index: 40;
}
.menu-btn {
  display: none; width: 36px; height: 36px; border: none; background: transparent;
  color: var(--text-secondary); border-radius: 8px; cursor: pointer; font-size: 18px;
  align-items: center; justify-content: center;
}
.logo {
  display: flex; align-items: center; gap: 10px;
  font-weight: 650; font-size: 15px; letter-spacing: -0.02em;
}
.logo-mark {
  width: 28px; height: 28px; border-radius: 8px;
  background: linear-gradient(135deg, #a78bfa, #f0abfc);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; box-shadow: 0 0 20px var(--purple-glow);
}
.topbar-spacer { flex: 1; }
.model-select {
  appearance: none; background: var(--bg-soft); border: 1px solid var(--border);
  color: var(--text); font: 500 13px var(--font); padding: 7px 28px 7px 12px;
  border-radius: 20px; cursor: pointer; outline: none; max-width: 180px;
}
.icon-btn {
  width: 36px; height: 36px; border: none; background: transparent;
  color: var(--text-secondary); border-radius: 8px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.icon-btn:active { background: var(--bg-hover); color: var(--text); }

.chat-area { flex: 1; overflow-y: auto; overflow-x: hidden; }
.chat-inner {
  max-width: 820px; margin: 0 auto; padding: 24px 20px 40px;
  min-height: 100%; display: flex; flex-direction: column;
}
.empty-state {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; text-align: center; padding: 40px 20px; gap: 12px;
}
.empty-icon {
  width: 64px; height: 64px; border-radius: 20px;
  background: linear-gradient(135deg, rgba(167,139,250,0.2), rgba(240,171,252,0.1));
  display: flex; align-items: center; justify-content: center;
  font-size: 28px; margin-bottom: 8px; box-shadow: 0 0 40px var(--purple-glow);
}
.empty-title { font-size: 22px; font-weight: 650; letter-spacing: -0.03em; }
.empty-sub { color: var(--text-secondary); font-size: 15px; max-width: 360px; }
.suggestions {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-top: 24px; max-width: 560px;
}
.suggestion {
  padding: 10px 16px; background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: 20px; font-size: 13px; color: var(--text-secondary); cursor: pointer;
}
.suggestion:active {
  background: var(--bg-hover); border-color: rgba(167,139,250,0.3); color: var(--text);
}

.message { display: flex; gap: 14px; margin-bottom: 28px; }
.msg-avatar {
  width: 32px; height: 32px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 600;
}
.msg-avatar.user { background: var(--bg-soft); border: 1px solid var(--border); color: var(--text-secondary); }
.msg-avatar.ai {
  background: linear-gradient(135deg, #a78bfa, #f0abfc); color: #0f0f12;
  box-shadow: 0 0 16px var(--purple-glow);
}
.msg-body { flex: 1; min-width: 0; padding-top: 4px; }
.msg-role { font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text); }
.msg-content { font-size: 15px; line-height: 1.65; color: var(--text); word-wrap: break-word; }
.msg-content p { margin-bottom: 12px; }
.msg-content p:last-child { margin-bottom: 0; }
.msg-content code {
  font-family: var(--mono); font-size: 0.9em;
  background: rgba(255,255,255,0.06); padding: 2px 6px; border-radius: 4px;
}
.msg-content pre {
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px 16px; overflow-x: auto; margin: 12px 0;
}
.msg-content pre code { background: none; padding: 0; font-size: 13px; }

.files-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px; margin-top: 16px;
}
.file-card {
  background: var(--bg-soft); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 14px;
  display: flex; flex-direction: column; gap: 12px;
}
.file-card-header { display: flex; align-items: center; gap: 10px; }
.file-icon {
  width: 36px; height: 36px; border-radius: 8px;
  background: rgba(167,139,250,0.12);
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
}
.file-meta { min-width: 0; flex: 1; }
.file-name { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-lang { font-size: 11px; color: var(--text-muted); text-transform: uppercase; }
.file-actions { display: flex; gap: 6px; }
.file-btn {
  flex: 1; padding: 8px 0; border: 1px solid var(--border); background: transparent;
  color: var(--text-secondary); font: 500 12px var(--font); border-radius: 7px; cursor: pointer;
}
.file-btn:active { background: rgba(167,139,250,0.12); color: var(--text); }
.file-btn.primary { background: rgba(167,139,250,0.15); border-color: rgba(167,139,250,0.3); color: var(--purple-bright); }
.files-footer { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.action-btn {
  padding: 8px 14px; border: 1px solid var(--border); background: var(--bg-soft);
  color: var(--text-secondary); font: 500 13px var(--font); border-radius: 8px; cursor: pointer;
}
.action-btn:active { background: var(--bg-hover); color: var(--text); }
.action-btn.primary {
  background: linear-gradient(135deg, rgba(167,139,250,0.2), rgba(240,171,252,0.1));
  border-color: rgba(167,139,250,0.35); color: var(--purple-bright);
}

.typing { display: flex; gap: 5px; padding: 8px 0; }
.typing span {
  width: 7px; height: 7px; background: var(--purple); border-radius: 50%;
  animation: bounce 1.2s infinite ease-in-out;
}
.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }
@keyframes bounce {
  0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
  40% { transform: scale(1); opacity: 1; }
}
.error-box {
  background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25);
  border-radius: var(--radius-sm); padding: 12px 14px; color: #fca5a5; font-size: 13.5px; margin-top: 8px;
}

.input-area {
  padding: 12px 16px calc(12px + var(--safe-bottom));
  border-top: 1px solid var(--border);
  background: rgba(15,15,18,0.85); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px); flex-shrink: 0;
}
.input-wrap {
  max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 18px;
  padding: 8px 10px 8px 12px;
}
.input-wrap:focus-within {
  border-color: rgba(167,139,250,0.45); box-shadow: 0 0 0 3px var(--purple-glow);
}
.attach-btn {
  width: 36px; height: 36px; border: none; background: transparent;
  color: var(--text-muted); border-radius: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0;
}
.chat-input {
  flex: 1; border: none; background: transparent; color: var(--text);
  font: 400 15px var(--font); resize: none; outline: none;
  max-height: 160px; min-height: 24px; line-height: 1.5; padding: 6px 0;
}
.chat-input::placeholder { color: var(--text-muted); }
.send-btn {
  width: 36px; height: 36px; border: none;
  background: linear-gradient(135deg, #a78bfa, #c084fc); color: #0f0f12;
  border-radius: 10px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
}
.send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.input-hint { text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 8px; }
.attach-preview {
  max-width: 820px; margin: 0 auto 8px; display: flex; flex-wrap: wrap; gap: 6px;
}
.attach-chip {
  display: flex; align-items: center; gap: 6px; padding: 5px 10px;
  background: var(--bg-soft); border: 1px solid var(--border); border-radius: 8px;
  font-size: 12px; color: var(--text-secondary);
}
.attach-chip button {
  border: none; background: none; color: var(--text-muted); cursor: pointer; font-size: 14px;
}

.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  z-index: 200; display: none; align-items: center; justify-content: center; padding: 16px;
}
.overlay.open { display: flex; }
.modal {
  background: var(--bg-elevated); border: 1px solid var(--border-strong);
  border-radius: var(--radius); width: 100%; max-width: 480px; max-height: 90vh;
  overflow: hidden; display: flex; flex-direction: column;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 18px; border-bottom: 1px solid var(--border);
}
.modal-title { font-size: 16px; font-weight: 600; }
.modal-close {
  width: 32px; height: 32px; border: none; background: transparent;
  color: var(--text-muted); border-radius: 8px; cursor: pointer; font-size: 18px;
}
.modal-body { padding: 18px; overflow-y: auto; flex: 1; }
.form-group { margin-bottom: 16px; }
.form-label {
  display: block; font-size: 12px; font-weight: 500;
  color: var(--text-secondary); margin-bottom: 6px;
}
.form-input {
  width: 100%; padding: 10px 12px; background: var(--bg-soft);
  border: 1px solid var(--border); border-radius: 8px; color: var(--text);
  font: 400 14px var(--font); outline: none;
}
.form-input:focus { border-color: var(--purple); }
.form-hint { font-size: 11px; color: var(--text-muted); margin-top: 5px; }
.modal-footer {
  padding: 14px 18px; border-top: 1px solid var(--border);
  display: flex; justify-content: flex-end; gap: 8px;
}
.btn {
  padding: 9px 18px; border-radius: 8px; font: 500 13px var(--font);
  cursor: pointer; border: 1px solid var(--border); background: var(--bg-soft); color: var(--text);
}
.btn-primary {
  background: linear-gradient(135deg, #a78bfa, #c084fc); border: none;
  color: #0f0f12; font-weight: 600;
}

.viewer-overlay {
  position: fixed; inset: 0; background: var(--bg); z-index: 300;
  display: none; flex-direction: column;
}
.viewer-overlay.open { display: flex; }
.viewer-top {
  height: 52px; display: flex; align-items: center; gap: 10px;
  padding: 0 14px; border-bottom: 1px solid var(--border);
  background: var(--bg-elevated); flex-shrink: 0;
}
.viewer-filename {
  font-weight: 600; font-size: 14px; flex: 1;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.viewer-body { flex: 1; display: flex; min-height: 0; }
.viewer-editor { flex: 1; min-width: 0; overflow: auto; }
.viewer-editor pre {
  margin: 0; padding: 16px; font-family: var(--mono); font-size: 13px;
  line-height: 1.5; white-space: pre-wrap; word-break: break-word; color: var(--text);
}
.viewer-preview {
  flex: 1; border-left: 1px solid var(--border); background: #fff; display: none;
}
.viewer-preview.open { display: block; }
.viewer-preview iframe { width: 100%; height: 100%; border: none; }

.project-panel {
  position: fixed; top: 0; right: 0; bottom: 0; width: 300px;
  background: var(--bg-elevated); border-left: 1px solid var(--border);
  z-index: 150; display: none; flex-direction: column;
}
.project-panel.open { display: flex; }
.project-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.project-title { font-weight: 600; font-size: 14px; }
.project-files { flex: 1; overflow-y: auto; padding: 10px; }
.project-file {
  display: flex; align-items: center; gap: 8px; padding: 9px 10px;
  border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--text-secondary);
}
.project-file:active { background: var(--bg-hover); color: var(--text); }

.sidebar-backdrop {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; display: none;
}
.sidebar-backdrop.open { display: block; }

.error-banner {
  position: fixed; top: 0; left: 0; right: 0; z-index: 9999;
  background: #7f1d1d; color: #fecaca; padding: 10px 16px; font-size: 13px;
  display: none; text-align: center;
}

@media (max-width: 768px) {
  .sidebar { position: fixed; top: 0; left: 0; bottom: 0; transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .menu-btn { display: flex; }
  .model-select { max-width: 130px; font-size: 12px; }
  .chat-inner { padding: 16px 14px 32px; }
  .files-grid { grid-template-columns: 1fr; }
  .empty-title { font-size: 18px; }
  .project-panel { width: 100%; }
}
@media (max-width: 480px) {
  .topbar { padding: 0 10px; }
  .logo span { display: none; }
  .input-area { padding: 8px 10px calc(8px + var(--safe-bottom)); }
}
</style>
</head>
<body>
<div class="error-banner" id="errorBanner"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button type="button" class="btn-new-chat" id="btnNewChat">+ New Chat</button>
    </div>
    <div class="chat-list" id="chatList">
      <div class="chat-list-label">Recent</div>
    </div>
    <div class="sidebar-footer">
      <button type="button" class="icon-btn" id="btnSettings" style="width:100%;justify-content:flex-start;gap:10px;padding:8px 12px;border-radius:8px;">
        <span>⚙</span> <span style="font-size:13px;color:var(--text-secondary)">Settings</span>
      </button>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="main">
    <header class="topbar">
      <button type="button" class="menu-btn" id="menuBtn">☰</button>
      <div class="logo"><div class="logo-mark">✦</div><span>Aether</span></div>
      <div class="topbar-spacer"></div>
      <select class="model-select" id="modelSelect"></select>
      <button type="button" class="icon-btn" id="btnProject" title="Project" style="display:none">📁</button>
      <button type="button" class="icon-btn" id="btnSettingsTop" title="Settings">⚙</button>
    </header>

    <div class="chat-area" id="chatArea">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="input-area">
      <div class="attach-preview" id="attachPreview"></div>
      <div class="input-wrap">
        <button type="button" class="attach-btn" id="attachBtn">+</button>
        <textarea class="chat-input" id="chatInput" rows="1" placeholder="Ask anything…"></textarea>
        <button type="button" class="send-btn" id="sendBtn">↑</button>
      </div>
      <div class="input-hint">AI generates real downloadable files • Personal use only</div>
    </div>
  </div>

  <div class="project-panel" id="projectPanel">
    <div class="project-header">
      <div class="project-title">Project Files</div>
      <button type="button" class="icon-btn" id="closeProject">✕</button>
    </div>
    <div class="project-files" id="projectFiles"></div>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Settings</div>
      <button type="button" class="modal-close" id="closeSettings">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">API Key</label>
        <input type="password" class="form-input" id="cfgApiKey" placeholder="sk-…">
        <div class="form-hint">Stored only in your browser</div>
      </div>
      <div class="form-group">
        <label class="form-label">Model</label>
        <input type="text" class="form-input" id="cfgModel" placeholder="kr/claude-sonnet-4.5">
      </div>
      <div class="form-group">
        <label class="form-label">Base URL</label>
        <input type="text" class="form-input" id="cfgBaseUrl" value="https://omnirouters.com/v1">
      </div>
      <div class="form-group">
        <label class="form-label">CORS Proxy</label>
        <input type="text" class="form-input" id="cfgProxy" placeholder="http://127.0.0.1:8080">
        <div class="form-hint">Termux: http://127.0.0.1:8080</div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn" id="cancelSettings">Cancel</button>
      <button type="button" class="btn btn-primary" id="saveSettings">Save</button>
    </div>
  </div>
</div>

<div class="viewer-overlay" id="viewerOverlay">
  <div class="viewer-top">
    <button type="button" class="icon-btn" id="viewerClose">←</button>
    <div class="viewer-filename" id="viewerFilename">file</div>
    <button type="button" class="action-btn" id="viewerCopy">Copy</button>
    <button type="button" class="action-btn" id="viewerDownload">Download</button>
    <button type="button" class="action-btn primary" id="viewerPreviewBtn" style="display:none">Preview</button>
  </div>
  <div class="viewer-body">
    <div class="viewer-editor" id="viewerEditor"></div>
    <div class="viewer-preview" id="viewerPreview">
      <iframe id="previewFrame" sandbox="allow-scripts allow-same-origin"></iframe>
    </div>
  </div>
</div>

<input type="file" id="fileInput" multiple style="display:none" accept=".html,.css,.js,.ts,.jsx,.tsx,.py,.json,.md,.txt,.svg,.xml">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
(function(){
"use strict";

function showError(msg){
  var el=document.getElementById("errorBanner");
  if(el){el.textContent=msg;el.style.display="block";}
  console.error(msg);
}

var state={
  chats:[],
  currentChatId:null,
  projectFiles:{},
  attachments:[],
  isGenerating:false,
  viewingFile:null
};

function $(id){return document.getElementById(id);}

function loadConfig(){
  return{
    apiKey:localStorage.getItem("aether_apiKey")||"",
    model:localStorage.getItem("aether_model")||"kr/claude-sonnet-4.5",

function languageFromName(name){
  var ext=(name.split(".").pop()||"").toLowerCase();
  var map={html:"html",htm:"html",css:"css",js:"javascript",mjs:"javascript",ts:"typescript",jsx:"javascript",tsx:"typescript",py:"python",json:"json",md:"markdown",txt:"text",svg:"xml",xml:"xml"};

function simpleMarkdown(text){
  if(!text)return"";
  var html=escapeHtml(text);
  html=html.replace(/```(\w*)\n([\s\S]*?)```/g,function(_,l,c){return"<pre><code>"+c.trim()+"</code></pre>";});
  html=html.replace(/`([^`]+)`/g,"<code>$1</code>");
  html=html.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  html=html.split(/\n\n+/).map(function(p){return"<p>"+p.replace(/\n/g,"<br>")+"</p>";}).join("");
  return html;
}

function downloadFile(name,content){
  var blob=new Blob([content],{type:"application/octet-stream"});
  var a=document.createElement("a");
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function downloadZip(files){
  if(typeof JSZip==="undefined"){alert("JSZip not loaded — check internet");return;}
  var zip=new JSZip();
  files.forEach(function(f){zip.file(f.name,f.content);});
  zip.generateAsync({type:"blob"}).then(function(blob){
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    var title=(getCurrentChat()&&getCurrentChat().title)||"project";
    a.download=title.replace(/[^\w\-]+/g,"_").slice(0,40)+".zip";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
  });
}

function inlineAssets(html,files){

    }
    if(f.name.indexOf(".js")!==-1){
      var reJs=new RegExp("<scr"+"ipt[^>]*src=[\"\']"+f.name+"[\"\'][^>]*>\s*</scr"+"ipt>","gi");
      html=html.replace(reJs,"<scr"+"ipt>"+f.content+"</scr"+"ipt>");
    }
  });
  return html;
}

function buildApiUrl(path){
  var cfg=loadConfig();
  var url=cfg.baseUrl.replace(/\/$/,"")+path;
  if(cfg.proxy){
    var proxy=cfg.proxy.trim();
    if(proxy.indexOf("?")===-1&&proxy.slice(-1)!=="=")proxy=proxy.replace(/\/?$/,"")+"/?url=";
    else if(proxy.slice(-1)==="/")proxy+="?url=";
    url=proxy+encodeURIComponent(url);
  }
  return url;
}
function wantsTextFormat(t){return/give me (the )?code in text|show me the code|print the (entire )?(html|code|script)|return it as text|as plain text|in text format|code only|paste the code/i.test(t);}
function buildSystemPrompt(textFormat){
  var projectCtx="";
  var keys=Object.keys(state.projectFiles);
  if(keys.length){
    projectCtx="\n\nCURRENT PROJECT FILES:\n";
    keys.forEach(function(k){var f=state.projectFiles[k];projectCtx+="=== "+f.name+" ===\n"+f.content+"\n\n";});
  }
  if(textFormat)return"You are Aether, a skilled coding assistant. The user asked for code in text format. Return code in markdown fenced blocks. Be concise."+projectCtx;
  return"You are Aether, a premium AI coding assistant.\n\nCRITICAL RULES FOR CODE GENERATION:\nWhen the user asks to create, build, write, generate, or modify code/apps/websites/scripts:\n1. Do NOT dump large source code in the chat.\n2. Reply with a short friendly explanation (1-3 sentences).\n3. Then output a JSON block:\n\n```json\n{\n  \"files\": [\n    {\"name\": \"filename.ext\", \"language\": \"html|css|javascript|python|json\", \"content\": \"full content\"}\n  ]\n}\n```\n\n- Put complete file content in the JSON.\n- For multi-file projects include all needed files.\n- When modifying, return only changed files.\n- Keep explanation short.\n\nIf just chatting, reply normally without JSON.\nBe helpful and concise."+projectCtx;
}
function parseFilesFromResponse(text){
  var jsonMatch=text.match(/```json\s*([\s\S]*?)```/i);
  if(!jsonMatch){var bare=text.match(/\{\s*"files"\s*:\s*\[[\s\S]*\]\s*\}/);if(bare)jsonMatch=[null,bare[0]];}
  if(jsonMatch){
    try{
      var raw=jsonMatch[1]||jsonMatch[0];
      var start=raw.indexOf("{"),end=raw.lastIndexOf("}");
      if(start>=0&&end>start)raw=raw.slice(start,end+1);
      var data=JSON.parse(raw);
      if(data.files&&Array.isArray(data.files)){
        return data.files.map(function(f){return{name:f.name||"file.txt",language:f.language||languageFromName(f.name||""),content:typeof f.content==="string"?f.content:JSON.stringify(f.content,null,2)};});
      }
    }catch(e){}
  }
  var files=[],blockRe=/```(\w+)?(?::?\s*([\w.\-\/]+))?\n([\s\S]*?)```/g,m,idx=0;
  while((m=blockRe.exec(text))!==null){
    var lang=(m[1]||"").toLowerCase(),name=m[2],content=m[3].replace(/\n$/,"");
    if(!name){
      var extMap={html:"index.html",css:"style.css",javascript:"script.js",js:"script.js",python:"script.py",py:"script.py",json:"data.json"};
      name=extMap[lang]||("file"+(idx||"")+"."+(lang||"txt"));
      if(files.some(function(f){return f.name===name;})){idx++;name="file"+idx+"."+(lang||"txt");}
    }
    files.push({name:name,language:languageFromName(name)||lang||"text",content:content});
  }
  return files.length?files:null;
}
function stripJsonFromMessage(text){
  return text.replace(/```json\s*[\s\S]*?```/gi,"").replace(/\{\s*"files"\s*:\s*\[[\s\S]*\}\s*\}/g,"").trim();
}

function callAI(userText){
  var cfg=loadConfig();
  if(!cfg.apiKey)return Promise.reject(new Error("API key not set. Open Settings ⚙ and add your key."));
  if(!cfg.model)return Promise.reject(new Error("Model not set. Open Settings."));
  var textFormat=wantsTextFormat(userText);
  var system=buildSystemPrompt(textFormat);
  var chat=getCurrentChat();
  var history=[];
  if(chat&&chat.messages){
    chat.messages.filter(function(m){return!m.error;}).slice(-12).forEach(function(m){
      history.push({role:m.role==="user"?"user":"assistant",content:m.content+(m.files?"\n\n[Generated files: "+m.files.map(function(f){return f.name;}).join(", ")+"]":"")});
    });
  }
  var finalUser=userText;
  if(state.attachments.length){
    finalUser+="\n\n--- Attached files ---\n";
    state.attachments.forEach(function(a){finalUser+="=== "+a.name+" ===\n"+a.content+"\n\n";});
  }
  var body={model:cfg.model,messages:[{role:"system",content:system}].concat(history).concat([{role:"user",content:finalUser}]),temperature:0.4,stream:false,max_tokens:16000};
  var url=buildApiUrl("/chat/completions");
  return fetch(url,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+cfg.apiKey},body:JSON.stringify(body)})
  .then(function(res){
    if(!res.ok)return res.text().then(function(t){
      if(res.status===401)throw new Error("Invalid API key (401).");
      if(res.status===404)throw new Error("Model not found (404).");
      throw new Error("API error "+res.status+": "+(t||"").slice(0,200));
    });
    return res.json();
  }).then(function(data){
    var content=data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
    if(!content)throw new Error("Empty response from model.");
    return{content:content,textFormat:textFormat};
  });
}

function sendMessage(text){
  text=(text||($("chatInput")&&$("chatInput").value)||"").trim();
  if(!text||state.isGenerating)return;
  var chat=getCurrentChat();
  if(!chat)chat=createChat();
  if(chat.messages.length===0)chat.title=text.slice(0,48)+(text.length>48?"…":"");
  chat.messages.push({role:"user",content:text});
  state.isGenerating=true;
  var input=$("chatInput");if(input){input.value="";autoResize();}
  var sendBtn=$("sendBtn");if(sendBtn)sendBtn.disabled=true;
  renderMessages();renderChatList();
  callAI(text).then(function(result){
    var displayContent=result.content,files=null;
    if(!result.textFormat){
      files=parseFilesFromResponse(result.content);
      if(files&&files.length){
        displayContent=stripJsonFromMessage(result.content)||"Done — here are your files.";
        files.forEach(function(f){state.projectFiles[f.name]=f;});
        chat.projectFiles=Object.assign({},state.projectFiles);
      }
    }
    chat.messages.push({role:"assistant",content:displayContent,files:files||null});
  }).catch(function(err){
    chat.messages.push({role:"assistant",content:"",error:err.message||"Something went wrong"});
  }).then(function(){
    state.isGenerating=false;state.attachments=[];renderAttachPreview();
    saveChats();renderMessages();renderChatList();updateProjectBtn();
    if(sendBtn)sendBtn.disabled=false;if(input)input.focus();
  });
}

  var chatInput=$("chatInput");
  if(chatInput){
    chatInput.onkeydown=function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}};
    chatInput.oninput=autoResize;
  }

  var btnNew=$("btnNewChat");

  var closeSet=$("closeSettings");

  var saveSet=$("saveSettings");

    saveConfig({
      apiKey:($("cfgApiKey")&&$("cfgApiKey").value.trim())||"",
      model:($("cfgModel")&&$("cfgModel").value.trim())||"",
      baseUrl:($("cfgBaseUrl")&&$("cfgBaseUrl").value.trim())||"https://omnirouters.com/v1",
      proxy:($("cfgProxy")&&$("cfgProxy").value.trim())||""
    });
    initModelSelect();closeSettings();
  };

  var modelSelect=$("modelSelect");
  if(modelSelect)modelSelect.onchange=function(){var cfg=loadConfig();cfg.model=modelSelect.value;saveConfig(cfg);};

  var chatList=$("chatList");
  if(chatList)chatList.onclick=function(e){
    var t=e.target;
    var del=t.closest?t.closest("[data-delete]"):null;
    if(del){e.stopPropagation();if(confirm("Delete this chat?"))deleteChat(del.getAttribute("data-delete"));return;}
    var ren=t.closest?t.closest("[data-rename]"):null;
    if(ren){e.stopPropagation();var id=ren.getAttribute("data-rename");var chat=null;for(var i=0;i<state.chats.length;i++){if(state.chats[i].id===id){chat=state.chats[i];break;}}var title=prompt("Rename chat",(chat&&chat.title)||"");if(title)renameChat(id,title);return;}
    var item=t.closest?t.closest(".chat-item"):null;
    if(item)switchChat(item.getAttribute("data-id"));
  };

  var chatInner=$("chatInner");
  if(chatInner)chatInner.onclick=function(e){
    var t=e.target;
    var promptBtn=t.closest?t.closest("[data-prompt]"):null;
    if(promptBtn){sendMessage(promptBtn.getAttribute("data-prompt"));return;}
    var openBtn=t.closest?t.closest("[data-open]"):null;
    if(openBtn){openFileViewer(openBtn.getAttribute("data-open"));return;}
    var copyBtn=t.closest?t.closest("[data-copy]"):null;
    if(copyBtn){var name=copyBtn.getAttribute("data-copy");var f=state.projectFiles[name];if(f&&navigator.clipboard){navigator.clipboard.writeText(f.content).then(function(){copyBtn.textContent="✓";setTimeout(function(){copyBtn.textContent="Copy";},1200);});}return;}
    var dlBtn=t.closest?t.closest("[data-dl]"):null;
    if(dlBtn){var n=dlBtn.getAttribute("data-dl");var file=state.projectFiles[n];if(file)downloadFile(file.name,file.content);return;}
    if(t.closest&&t.closest("[data-dl-all]")){var files=[];for(var k in state.projectFiles)files.push(state.projectFiles[k]);if(files.length)downloadZip(files);return;}
    if(t.closest&&t.closest("[data-preview-all]")){var fl=[];for(var k2 in state.projectFiles)fl.push(state.projectFiles[k2]);previewProject(fl);return;}
  };

  var attachBtn=$("attachBtn");
  if(attachBtn)attachBtn.onclick=function(){var fi=$("fileInput");if(fi)fi.click();};

  var fileInput=$("fileInput");
  if(fileInput)fileInput.onchange=function(e){
    var files=Array.prototype.slice.call(e.target.files||[]);
    var pending=files.length;if(!pending)return;
    files.forEach(function(file){
      var reader=new FileReader();
      reader.onload=function(){state.attachments.push({name:file.name,content:reader.result});pending--;if(pending===0)renderAttachPreview();};
      reader.readAsText(file);
    });
    e.target.value="";
  };

  var attachPreview=$("attachPreview");
  if(attachPreview)attachPreview.onclick=function(e){
    var btn=e.target.closest?e.target.closest("[data-rm]"):null;
    if(btn){state.attachments.splice(+btn.getAttribute("data-rm"),1);renderAttachPreview();}
  };

  var viewerClose=$("viewerClose");if(viewerClose)viewerClose.onclick=closeViewer;
  var viewerCopy=$("viewerCopy");
  if(viewerCopy)viewerCopy.onclick=function(){
    if(state.viewingFile&&navigator.clipboard){navigator.clipboard.writeText(state.viewingFile.content).then(function(){viewerCopy.textContent="Copied!";setTimeout(function(){viewerCopy.textContent="Copy";},1200);});}
  };
  var viewerDl=$("viewerDownload");
  if(viewerDl)viewerDl.onclick=function(){if(state.viewingFile)downloadFile(state.viewingFile.name,state.viewingFile.content);};
  var viewerPrev=$("viewerPreviewBtn");if(viewerPrev)viewerPrev.onclick=previewInViewer;

  var btnProject=$("btnProject");
  if(btnProject)btnProject.onclick=function(){renderProjectPanel();var pp=$("projectPanel");if(pp)pp.classList.add("open");};
  var closeProject=$("closeProject");
  if(closeProject)closeProject.onclick=function(){var pp=$("projectPanel");if(pp)pp.classList.remove("open");};
  var projectFiles=$("projectFiles");
  if(projectFiles)projectFiles.onclick=function(e){
    var item=e.target.closest?e.target.closest("[data-open]"):null;
    if(item){openFileViewer(item.getAttribute("data-open"));var pp=$("projectPanel");if(pp)pp.classList.remove("open");}
  };

  var settingsOverlay=$("settingsOverlay");
  if(settingsOverlay)settingsOverlay.onclick=function(e){if(e.target===settingsOverlay)closeSettings();};
}

function boot(){
  try{
    state.chats=loadChats();
    if(!state.chats.length)createChat();
    else{state.currentChatId=state.chats[0].id;state.projectFiles=Object.assign({},state.chats[0].projectFiles||{});}
    initModelSelect();renderChatList();renderMessages();updateProjectBtn();wireEvents();
    setTimeout(function(){var input=$("chatInput");if(input)input.focus();},200);
  }catch(err){showError("Startup error: "+(err.message||err));}
}

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script>
</body>
</html>
